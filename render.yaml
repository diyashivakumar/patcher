# PatchProof backend — Render blueprint. Deploy from branch feature/dashboard-optimization-multilingual.
# Secrets (sync:false) are entered in the Render dashboard, never stored in the repo.
services:
  - type: web
    name: patchproof-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL          # Neon connection string — paste in dashboard
        sync: false
      - key: FRONTEND_ORIGIN       # set to the Vercel URL after the frontend deploys
        sync: false
